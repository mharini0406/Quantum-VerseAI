{% extends "base.html" %}

{% block title %}
Quantum Quiz | QuantumVerse AI
{% endblock %}


{% block content %}


<section class="quiz-page">


    <div class="quiz-header">

        <h1>📝 Quantum Computing Quiz</h1>

        <p>
            Test your knowledge of Quantum Computing concepts,
            algorithms, and technologies.
        </p>

    </div>



    <div class="quiz-card" id="quiz-container">


        <!-- Question -->
        <h2 id="question">
            Loading Question...
        </h2>



        <!-- Options -->
        <div id="options">

        </div>



        <!-- Progress Bar -->

        <div class="progress-container">

            <div id="progress"></div>

        </div>



        <!-- Navigation Buttons -->

        <div class="quiz-buttons">


            <button 
            class="quiz-btn"
            onclick="previousQuestion()">

                ⬅ Previous

            </button>



            <button 
            class="quiz-btn"
            onclick="nextQuestion()">

                Next ➡

            </button>


        </div>


    </div>



</section>



<script src="{{ url_for('static', filename='js/quiz.js') }}">
</script>


{% endblock %}
